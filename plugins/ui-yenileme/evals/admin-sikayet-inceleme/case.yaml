schema_version: "1.1"
name: admin-sikayet-inceleme
expected_outcome: |
  Projenin admin panelindeki şikayet inceleme (moderasyon) sayfası için araştırmaya dayalı web tasarım önerisi.
  Bir Design tuvali oluşturulur; geniş (web) sayfa çerçeveleri kullanılır ve bugünkü hâl ile yeni hâl karşılaştırılır
  (ekran görüntüsü yoksa bugünkü yapı koddan çıkarılıp tarif edilir).
  Koddaki mevcut rol/izin ve güvenlik kuralları korunur. Kullanıcıya Türkçe özet ve karar listesi verilir. Kod değiştirilmez.
